  <style>
    :root {
      --bg: #FAFAF8;
      --text: #1A1A1A;
      --muted: #6B7280;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      max-width: 480px;
      width: 100%;
      padding: 48px 24px;
      text-align: center;
    }
    .brand {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand span {
      color: var(--accent);
    }
    .desc {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .links {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .links a {
      display: block;
      padding: 14px 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      transition: all .15s;
    }
    .links a:hover {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }
    .links a .date {
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
      font-weight: 400;
    }
    .tip {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span>AI</span>产品日报</div>
    <p class="desc">每日 AI 产品动态，5 分钟速读<br>聚焦应用层，链接可点击</p>
